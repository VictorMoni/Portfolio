name: Portfolio CI
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
permissions:
  contents: read
jobs:
  validate:
    name: Portfolio Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
